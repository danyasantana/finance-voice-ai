spring:
  application:
    name: finance-voice-ai

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_voice
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
      init:
        pull-model-strategy: when_missing

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.finance.voice: DEBUG
    org.springframework.ai: DEBUG
